
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yarrow-Mullein Bank Services</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <h1>Yarrow-Mullein Bank Services</h1><h2>Register</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label for="first_name" class="form-label">First Name</label>
      <input type="text" class="form-control" id="first_name" name="first_name" required>
    </div>
    <div class="mb-3">
      <label for="last_name" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="last_name" name="last_name" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <a href="/api/login" class="btn btn-link">Already have an account? Login</a>
  </form>
<footer style="position:fixed;bottom:0;right:0;background:white;color:#333;padding:6px 12px;font:12px sans-serif;border-top:1px solid #ddd">Sharhan Kaji | 0424551 | <time id="capture-time"></time></footer><script>function showTime(){document.getElementById('capture-time').textContent=new Date().toLocaleString('en-CA',{timeZone:'America/Winnipeg',timeZoneName:'short'});}showTime();setInterval(showTime,1000);</script></body>
</html>
